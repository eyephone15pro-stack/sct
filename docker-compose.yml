services:

  # =========================
  # Python Service
  # =========================
  python-service:
    build:
      context: ./python.prediction.model.api
      dockerfile: Dockerfile

    container_name: python.prediction.model.api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - ./python.prediction.model.api/.env

    networks:
      - app-network


  # =========================
  # NestJS API
  # =========================
  nest-service:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: server

    restart: unless-stopped

    ports:
      - "3001:3000"

    env_file:
      - ./server/.env

    depends_on:
      - python.prediction.model.api

    networks:
      - app-network


  # =========================
  # Next.js Frontend
  # =========================
  next-service:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: next-service

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - ./client/.env

    depends_on:
      - server

    networks:
      - app-network


# =========================
# Network
# =========================
networks:
  app-network:
    driver: bridge